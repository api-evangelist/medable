- name: delete_object
  description: Delete an object instance.
  source_operation: DELETE /{org_code}/v2/{object}/{id}
- name: aggregate_objects
  description: Run an aggregation pipeline over an object.
  source_operation: GET /{org_code}/v2/{object} (aggregation operators)
