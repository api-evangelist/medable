  note: >-
    Full STEP 0b sweep against api.medable.com, www.medable.com and docs.medable.com.
    No /openapi.json, /openapi.yaml, /swagger.json, /v1|/v2 openapi, /api-docs, /docs or
    /redoc returned a parseable spec; api.medable.com answers every unmatched path with
    the Cortex fault envelope because the API is org-scoped
