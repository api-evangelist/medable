description: >-
  Cross-cutting technical standard conformance for the Medable Cortex API, derived
  from the published documentation, plus the regulatory compliance posture Medable
  publishes on its own site. Cortex is a proprietary schema-driven object API; it does
  not implement OAuth2/OIDC or RFC 9457 problem+json (it uses a custom fault envelope).
  Medable operates no public trust center and publishes no SOC 2 / ISO 27001 / HITRUST
  attestation page, so no security certification is asserted here — only the regulatory
  regimes Medable states its products conform to.
