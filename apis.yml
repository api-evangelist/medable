aid: medable
name: Medable
description: >-
  Medable operates a clinical trial technology platform for decentralized and hybrid
  trials, combining eCOA/ePRO data capture, electronic consent, televisit, and a suite
  of agentic-AI products (Agent Studio, CRA Agent, PI Summary Review, Digital Data Flow
  agent) for life-sciences sponsors and CROs. Its developer surface is the Cortex API —
  a schema-driven object platform (custom objects and properties, querying, aggregation,
  and server-side scripting) addressed over REST at api.<env>.medable.com/<org_code>/v2/,
  with session-based and request-signature authentication, an mdctl developer CLI, and an
  iOS/Swift SDK. Backed by Obvious Ventures and Sapphire Ventures.
