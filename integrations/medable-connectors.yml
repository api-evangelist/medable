description: >-
  Medable Connectors — the published integration catalog for the Medable agentic
  platform (Agent Studio and the CRA / PI Summary Review / eTMF / Digital Data Flow
  agents). Captured verbatim from the provider's own connectors directory. These are
  LISTING-ONLY entries: Medable publishes no OpenAPI, no MCP server and no per-connector
  configuration contract, so no Arazzo workflow can be authored against them without
  fabricating operations. Recorded here as a real surface measurement, not a spec.
notes: >-
  Medable's public developer contract (the Cortex API at docs.medable.com) and this
  connector catalog are DIFFERENT surfaces. Connectors are configured inside the Medable
  platform by a customer's own organization ("managed securely by your organization"),
  not called over the Cortex REST API. The "Agent-to-Agent Ecosystem" category asserts
  interoperation with Google Agentspace, Microsoft Copilot and Salesforce Agentforce,
  but Medable serves no A2A Agent Card at /.well-known/agent-card.json or
  /.well-known/agent.json on any of its hosts (probed 2026-08-15, all 404), and no MCP
  endpoint was located. The interoperability claim is marketing copy, not a discoverable
  agent contract.
