notes: >-
  Medable's official developer tooling is the mdctl monorepo (github.com/Medable/mdctl),
  published to npm under the @medable scope. The CLI binary (mdctl) ships in
  @medable/mdctl-cli; @medable/mdctl-api and @medable/mdctl-api-driver are the API
  client libraries. An unscoped npm package named "medable" is a third-party client
  (github.com/cepr/medable) and is NOT first-party.
